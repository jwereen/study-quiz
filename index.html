<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provquiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Startsida: en lista med ett kort per prov. Nya prov läggs överst i listan. */
:root{
  --bg:#eaf1f6; --ink:#13232f; --card:#ffffff; --accent:#1c6f8c; --line:#cfdce5; --mute:#5a6e7c;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
main{max-width:680px;margin:0 auto;padding:22px 16px 48px}
h1{font-family:var(--display);font-weight:600;font-size:30px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mute);font-weight:600;margin:0 0 18px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.quiz{display:block;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;color:inherit;text-decoration:none}
a.quiz:hover,a.quiz:focus-visible{border-color:var(--accent);outline:none}
.quiz h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0 0 2px}
.quiz p{margin:2px 0;color:var(--mute);font-weight:600}
.date{display:inline-block;margin-top:8px;font-weight:800;font-size:14px;color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Provquiz</h1>
  <p class="sub">Välj prov och börja öva.</p>
  <ul>
    <li><a class="quiz" href="geografi/">
      <h2>Geografi</h2>
      <p>Jordytan förändras och världsdelen Europa</p>
      <span class="date">Prov torsdag 26/11</span>
    </a></li>
  </ul>
</main>
</body>
</html>
